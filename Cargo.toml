[workspace]
members = [
    "crates/*",
    "squigit-cli",
    "squigit-ocr",
    "squigit-rs",
    "xtask",
]

resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/squigit-org/squigit"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "debuginfo"
panic = "abort"

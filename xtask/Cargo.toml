[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem", "rand_core", "zeroize"] }
globset = "0.4"
hex = "0.4"
rand = "0.10.2"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.0"
toml = "1.1.4+spec-1.1.0"
toml_edit = "0.25.13+spec-1.1.0"
which = "8.0.5"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.12"

[[bin]]
name = "xtask"
path = "src/main.rs"

[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Repository development commands for Squigit"
publish = false

[dependencies]
flate2 = "1.1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde_json = "1.0"
tar = "0.4"
toml_edit = "0.22"

[[bin]]
name = "xtask"
path = "src/main.rs"

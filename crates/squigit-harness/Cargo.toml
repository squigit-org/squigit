[package]
name = "squigit-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Document conversion, image renditions, and file reading tools for Squigit"

[dependencies]
blake3 = "1.5"
dirs = "6.0"
fast_image_resize = "6"
globset = "0.4"
ignore = "0.4"
image = "0.25"
png = "0.18"
resvg = "0.45"
webp = "0.3"
regex = "1.12.3"
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
squigit-storage = { version = "0.1.0", path = "../squigit-storage" }
office2pdf = "0.8.0"
hayro = "0.7.1"
lopdf = { version = "0.42", default-features = false }
pdf-extract = "0.12.1"
font8x8 = "0.3"
tempfile = "3"
thiserror = "2"
fs2 = "0.4"

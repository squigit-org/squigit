[package]
name = "squigit-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Document conversion, image renditions, and file reading tools for Squigit"

[dependencies]
blake3 = "1.5"
fast_image_resize = "6"
globset = "0.4"
ignore = "0.4"
image = "0.25"
png = "0.18"
resvg = "0.45"
webp = "0.3"
regex = "1.12.3"
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
squigit-storage = { version = "0.1.0", path = "../squigit-storage" }
office2pdf = "=0.6.5"

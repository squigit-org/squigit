[package]
name = "squigit-brain"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Conversation, attachment, and search engine for Squigit"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
regex = "1.12.3"
url = "2.5"
lazy_static = "1.4.0"
rand = "0.8"
base64 = "0.22.1"
blake3 = "1.5"
tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
squigit-storage = { version = "0.2.0", path = "../squigit-storage" }
squigit-auth = { version = "0.2.0", path = "../squigit-auth" }
squigit-harness = { version = "0.2.0", path = "../squigit-harness" }
chrono = "0.4"
log = "0.4"
uuid = { version = "1", features = ["v4"] }

[package]
name = "squigit-brain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Gemini attachment preparation and title generation for Squigit"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
futures-util = "0.3"
rand = "0.8"
base64 = "0.22.1"
blake3 = "1.5"
tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
squigit-storage = { version = "0.1.0", path = "../squigit-storage" }
squigit-auth = { version = "0.1.0", path = "../squigit-auth" }
squigit-harness = { version = "0.1.0", path = "../squigit-harness" }
chrono = "0.4"
log = "0.4"

name: "OCR Build Matrix"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Operating system to build and smoke-check"
        required: true
        type: choice
        default: ubuntu-x64
        options:
          - ubuntu-x64
          - fedora-x64
          - windows-x64
          - macos-arm

jobs:
  build-ocr:
    name: OCR ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'windows-x64' && 'windows-latest' || inputs.platform == 'macos-arm' && 'macos-latest' || 'ubuntu-latest' }}
    container: ${{ inputs.platform == 'fedora-x64' && 'fedora:latest' || '' }}
    env:
      OCR_OS_NAME: ${{ inputs.platform == 'windows-x64' && 'Windows-x64' || inputs.platform == 'fedora-x64' && 'Fedora-x64' || inputs.platform == 'macos-arm' && 'macOS-ARM' || 'Ubuntu-x64' }}
      OCR_TARGET: ${{ inputs.platform == 'windows-x64' && 'x86_64-pc-windows-msvc' || inputs.platform == 'macos-arm' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}

    steps:
      - name: Pre-setup Fedora container
        if: inputs.platform == 'fedora-x64'
        run: |
          dnf install -y git curl tar gzip gcc-c++ make python3 python3-pip perl-open perl-FindBin findutils patch
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v6

      - name: Build OCR baseline (onefile)
        uses: ./.github/actions/build-squigit-ocr
        with:
          python-version: "3.12"
          pyi-mode: "onefile"

      - name: Clean OCR build folders only
        if: inputs.platform != 'windows-x64'
        run: |
          rm -rf squigit-ocr/native/build squigit-ocr/native/dist

      - name: Clean OCR build folders only (Windows)
        if: inputs.platform == 'windows-x64'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force squigit-ocr/native/build, squigit-ocr/native/dist -ErrorAction SilentlyContinue

      - name: Build OCR candidate (onedir)
        uses: ./.github/actions/build-squigit-ocr
        with:
          python-version: "3.12"
          pyi-mode: "onedir"

      - name: Generate PNG smoke image (Unix)
        if: inputs.platform != 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          squigit-ocr/native/venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          source = Image.new("RGB", (240, 60), "white")
          ImageDraw.Draw(source).text((10, 20), "SQUIGIT OCR SMOKE", fill="black")
          image = source.resize((960, 240), Image.Resampling.NEAREST)
          image.save(Path("/tmp/ocr-smoke.png"))
          PY

      - name: Generate PNG smoke image (Windows)
        if: inputs.platform == 'windows-x64'
        shell: pwsh
        run: |
          $code = @"
          from pathlib import Path
          import os
          from PIL import Image, ImageDraw

          source = Image.new('RGB', (240, 60), 'white')
          ImageDraw.Draw(source).text((10, 20), 'SQUIGIT OCR SMOKE', fill='black')
          image = source.resize((960, 240), Image.Resampling.NEAREST)
          image.save(Path(os.environ['TEMP']) / 'ocr-smoke.png')
          "@
          & squigit-ocr/native/venv/Scripts/python.exe -c $code

      - name: Run sidecar CLI and print JSON (Unix)
        if: inputs.platform != 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "binaries/paddle-ocr-$OCR_TARGET/squigit-ocr" || true
          "binaries/paddle-ocr-$OCR_TARGET/squigit-ocr" /tmp/ocr-smoke.png | tee /tmp/ocr-smoke-output.json

      - name: Run sidecar CLI and print JSON (Windows)
        if: inputs.platform == 'windows-x64'
        shell: pwsh
        run: |
          & "binaries/paddle-ocr-$env:OCR_TARGET/squigit-ocr.exe" "$env:TEMP/ocr-smoke.png" | Tee-Object -FilePath "$env:TEMP/ocr-smoke-output.json"

      - name: Validate OCR JSON payload (Unix)
        if: inputs.platform != 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          squigit-ocr/native/venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          out = Path("/tmp/ocr-smoke-output.json")
          payload = json.loads(out.read_text(encoding="utf-8").strip())
          if isinstance(payload, dict) and "error" in payload:
              raise SystemExit(f"OCR returned error: {payload['error']}")
          if not isinstance(payload, list):
              raise SystemExit(f"OCR payload type {type(payload).__name__}, expected list")
          if not payload:
              raise SystemExit("OCR payload list is empty")
          text_values = [str(item.get("text", "")).strip() for item in payload if isinstance(item, dict)]
          merged = " | ".join(text for text in text_values if text)
          print(f"Detected entries: {len(payload)}")
          print(f"Detected text: {merged}")
          PY

      - name: Validate OCR JSON payload (Windows)
        if: inputs.platform == 'windows-x64'
        shell: pwsh
        run: |
          $code = @"
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['TEMP']) / 'ocr-smoke-output.json'
          payload = json.loads(out.read_text(encoding='utf-8').strip())
          if isinstance(payload, dict) and 'error' in payload:
              raise SystemExit(f'OCR returned error: {payload["error"]}')
          if not isinstance(payload, list):
              raise SystemExit(f'OCR payload type {type(payload).__name__}, expected list')
          if not payload:
              raise SystemExit('OCR payload list is empty')
          text_values = [str(item.get('text', '')).strip() for item in payload if isinstance(item, dict)]
          merged = ' | '.join(text for text in text_values if text)
          print(f'Detected entries: {len(payload)}')
          print(f'Detected text: {merged}')
          "@
          & squigit-ocr/native/venv/Scripts/python.exe -c $code

      - name: Upload OCR smoke artifacts (Unix)
        if: inputs.platform != 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: ocr-smoke-artifacts-${{ inputs.platform }}
          path: |
            /tmp/ocr-smoke.png
            /tmp/ocr-smoke-output.json

      - name: Upload OCR smoke artifacts (Windows)
        if: inputs.platform == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: ocr-smoke-artifacts-${{ inputs.platform }}
          path: |
            ${{ runner.temp }}/ocr-smoke.png
            ${{ runner.temp }}/ocr-smoke-output.json

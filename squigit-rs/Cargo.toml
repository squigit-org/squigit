[package]
name = "squigit-rs"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "The public Rust facade for Squigit"

[lib]
name = "squigit"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fsindex = "0.3.1"
image = "0.25"
mime_guess = "2.0"
nucleo-matcher = "0.3.1"
ocr-runtime = { path = "../crates/ocr-runtime" }
reqwest = { version = "0.11", features = ["json", "multipart", "rustls-tls"] }
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
squigit-auth = { path = "../crates/squigit-auth" }
squigit-brain = { path = "../crates/squigit-brain" }
squigit-harness = { path = "../crates/squigit-harness" }
squigit-storage = { path = "../crates/squigit-storage" }
semver = "1.0"
thiserror = "2.0"
tokio = { version = "1.37", features = ["fs", "macros", "rt", "sync", "time"] }
toml = "0.8"
url = "2.5"
webbrowser = "1.2.1"
